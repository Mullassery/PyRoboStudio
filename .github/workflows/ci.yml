name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build

  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
        working-directory: sidecar
      - run: uv run python -m pyrobostudio_sidecar.make_fixture
        working-directory: sidecar
      - run: uv run pytest -q
        working-directory: sidecar

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: uv sync
        working-directory: sidecar
      - run: uv run python -m pyrobostudio_sidecar.make_fixture
        working-directory: sidecar
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --retries=1
